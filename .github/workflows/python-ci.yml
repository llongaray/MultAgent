name: Python CI
on:
  pull_request:
    branches: [dev, hml, main]
  push:
    branches: [dev, hml, main]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Python compile
        run: python -m compileall -q src tests
      - name: Ruff
        run: python -m ruff check src/multagent tests/unit --select E4,E7,E9,F
