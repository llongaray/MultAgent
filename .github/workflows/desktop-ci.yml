name: Desktop Qt smoke
on:
  pull_request:
    branches: [dev, hml, main]
  push:
    branches: [dev, hml, main]
permissions:
  contents: read
jobs:
  qt:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install Desktop and test dependencies
        run: python -m pip install -e ".[desktop,dev]"
      - name: Test native Qt with no HTTP bind
        run: python -m pytest -q tests/unit/test_p4_desktop.py
